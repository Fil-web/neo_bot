[project]
name = "filka-bot"
version = "0.1.0"
description = "Telegram AI assistant bot with GigaChat and aiogram"
requires-python = ">=3.9"
dependencies = [
  "aiogram>=3.7.0,<4.0.0",
  "gigachat>=0.1.39",
  "pydantic-settings>=2.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
